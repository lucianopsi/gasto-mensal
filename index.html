<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gasto Mensal</title>
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma coluna (máx. 760px) — barra superior, cartão de saldo, atalhos, gavetas; navegação fixa embaixo. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#eaedf2; --ink:#141821; --ink-2:#465061; --ink-3:#5f6878;
  --line:#dde2ea; --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e3eefb; --on-accent:#ffffff;
  --hero:#1f5fae; --hero-2:#cfe1f7;
  --nu:#6250d6; --inter:#eb6834; --outros:#8a93a3;
  --good:#11804a; --good-soft:#e2f4ea; --bad:#c42f2f; --bad-soft:#fbe7e7; --warn:#a06200; --warn-soft:#fdf1dc;
  --bar:#2a78d6; --bar-neg:#d03b3b; --grid:#e6e9ef; --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 20px rgba(20,24,33,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a21; --sunk:#11141a; --ink:#eef0f4; --ink-2:#bcc3cf; --ink-3:#98a0ae;
  --line:#272c37; --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16253a; --on-accent:#ffffff;
  --hero:#1a4a86; --hero-2:#b7d3f6;
  --nu:#9085e9; --inter:#d95926; --outros:#7d8594;
  --good:#4cc38a; --good-soft:#12291e; --bad:#f07070; --bad-soft:#3a1717; --warn:#f0b44c; --warn-soft:#33260f;
  --bar:#3987e5; --bar-neg:#e66767; --grid:#252a34; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a21; --sunk:#11141a; --ink:#eef0f4; --ink-2:#bcc3cf; --ink-3:#98a0ae;
  --line:#272c37; --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16253a; --on-accent:#ffffff;
  --hero:#1a4a86; --hero-2:#b7d3f6;
  --nu:#9085e9; --inter:#d95926; --outros:#7d8594;
  --good:#4cc38a; --good-soft:#12291e; --bad:#f07070; --bad-soft:#3a1717; --warn:#f0b44c; --warn-soft:#33260f;
  --bar:#3987e5; --bar-neg:#e66767; --grid:#252a34; --shadow:none; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
.muted{color:var(--ink-3)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
svg.i{width:22px;height:22px;flex:none}
.hide-vals .money{filter:blur(7px);user-select:none}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--ink-3)}
.iconbtn.flat{border-color:transparent;background:transparent}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);border:0;background:none;padding:6px;min-height:44px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="offline"] i{background:var(--ink-3)}
.sync[data-s="error"] i{background:var(--bad)}
@media (max-width:440px){.sync span{display:none}}
.hchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;min-height:44px;font-weight:600;font-size:14px;position:relative}
.hchip .av{width:32px;height:32px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.hchip .dot{position:absolute;top:6px;left:28px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.hchip[aria-pressed="true"]{border-color:var(--warn)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.monthnav .m{flex:1;text-align:center;min-width:0}
.monthnav .m b{display:block;font-family:var(--f-display);font-size:17px;text-transform:capitalize}
.monthnav .m span{font-size:12px;color:var(--ink-3)}

/* bottom nav */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11.5px;font-weight:600;position:relative}
.bnav button[aria-current="page"]{color:var(--accent-ink)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

main{padding-top:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}

/* hero */
.hero{background:var(--hero);color:var(--on-accent);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.hero .lbl{font-size:13px;color:var(--hero-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .big{font-family:var(--f-num);font-size:clamp(30px,8vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.hero .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.hero .row2 small{display:block;font-size:12px;color:var(--hero-2)}
.hero .row2 b{font-family:var(--f-num);font-weight:500;font-size:16px}
.hero .flowbar{background:rgba(255,255,255,.16)}
.hero .eye{border:0;background:rgba(255,255,255,.12);color:var(--on-accent);border-radius:10px;width:40px;height:36px;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;width:max-content}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--sunk);color:var(--ink-2)}
.hero .pill.good{background:#e2f4ea;color:#0d6b3d}.hero .pill.bad{background:#fbe7e7;color:#a42424}.hero .pill.neutral{background:rgba(255,255,255,.16);color:var(--on-accent)}
.flowbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk);gap:2px}
.flowbar i{display:block;height:100%}

/* quick actions */
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.quick button{flex:1 1 0;min-width:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 2px}
.quick .ic{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.quick button:hover .ic{border-color:var(--accent);color:var(--accent-ink)}

/* drawers */
details.drw{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
details.drw>summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 20px;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:64px}
details.drw>summary::-webkit-details-marker{display:none}
details.drw>summary .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
details.drw>summary .t{min-width:0}
details.drw>summary .t b{display:block;font-weight:600}
details.drw>summary .t small{display:block;font-size:12.5px;color:var(--ink-3)}
details.drw>summary .v{text-align:right;font-family:var(--f-num);font-weight:500;font-size:16px}
details.drw>summary .v small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--ink-3);font-weight:400}
details.drw>summary .chev{transition:transform .15s;color:var(--ink-3)}
details.drw[open]>summary .chev{transform:rotate(90deg)}
details.drw[open]>summary{border-bottom:1px solid var(--line)}
.drw-body{padding:6px 16px 14px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;color:var(--ink-2)}
.kv b{font-family:var(--f-num);font-weight:500;color:var(--ink)}

/* banners */
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.recrow{display:grid;grid-template-columns:minmax(0,1fr) 104px auto auto;gap:8px;align-items:center}
@media (max-width:520px){.recrow{grid-template-columns:minmax(0,1fr) 96px}}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;min-height:44px;width:100%;min-width:0}
textarea{min-height:140px;font-family:var(--f-num);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;min-height:38px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ledger list */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ledger{display:flex;flex-direction:column}
.grp{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;border-bottom:1px solid var(--line);font-weight:700;gap:8px}
.grp .num{font-weight:500}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;align-items:center;min-height:52px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .d{font-weight:500;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);grid-column:1}
.item .val{text-align:right;grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end}
.item .val small{font-size:12px;color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--ink-2);font-size:12px;font-weight:500}
.tag.hel{background:var(--warn-soft);color:var(--warn)}
.tag.half{background:var(--accent-soft);color:var(--accent-ink)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:center;margin-bottom:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;height:auto}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
.chart .vl{font-family:var(--f-num);fill:var(--ink-2);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip b{font-family:var(--f-num);font-weight:500}
.catlist{display:flex;flex-direction:column}
.catrow{border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catbtn{display:grid;grid-template-columns:minmax(0,1fr) 96px 18px;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 2px;text-align:left;min-height:52px}
.catbtn .n{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere;min-width:0}
.catbtn .track{display:block;position:relative;height:8px;border-radius:4px;background:var(--sunk);margin-top:6px;width:100%}
.catbtn .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:4px}
.catbtn .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.catbtn .v{text-align:right;grid-row:1;grid-column:2}
.catbtn .chev{grid-row:1;grid-column:3;color:var(--ink-3);transition:transform .15s}
.catbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.catbody{padding:2px 2px 14px}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.tscroll{overflow-x:auto}

/* modal / dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:12px;padding:10px 12px}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-height:64px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.opt b{display:block}.opt small{color:var(--ink-3);font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:31;border-radius:999px;padding:14px 20px;box-shadow:0 6px 20px rgba(42,120,214,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;font-weight:500;max-width:calc(100% - 32px);pointer-events:none}
.modal-open .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.empty{padding:24px 12px;text-align:center;color:var(--ink-3)}
.skeleton{padding:60px 12px;text-align:center;color:var(--ink-3)}
.imp-table td{padding:6px}
.imp-table select,.imp-table input{min-height:36px;padding:5px 8px;font-size:13px}
.dup td{opacity:.55}
.catmgr{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;align-items:center;margin-bottom:8px}
.catmgr small{color:var(--ink-3);font-size:12px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>
<div id="tip" hidden></div>
<header class="top">
  <div class="top-in">
    <div class="bar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><b>Gasto Mensal</b></div>
      <div class="bar-r">
        <button class="sync" id="sync" data-act="syncInfo" data-s="ok" aria-label="Sincronizado"><i></i><span>Sincronizado</span></button>
        <button class="hchip" id="hchip" data-act="helena" aria-label="Abrir resumo da Helena"><span class="av">H</span>Helena<span class="dot" id="hdot" hidden></span></button>
      </div>
    </div>
    <div class="monthnav" id="monthnav">
      <button class="iconbtn" data-act="prev" aria-label="Mês anterior"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="m"><b id="mlabel">—</b><span id="msub">&nbsp;</span></div>
      <button class="iconbtn" data-act="next" aria-label="Próximo mês"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</header>
<div class="wrap"><main id="main"><div class="skeleton">Carregando seus gastos…</div></main></div>
<button class="btn primary fab" id="fab" data-act="add" hidden><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Gasto</button>

const ico=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||""}</svg>`;

/* ---------- constants & helpers ---------- */
const CARDS = {nu:{name:"Nubank",color:"var(--nu)"}, inter:{name:"Inter",color:"var(--inter)"}, outros:{name:"Outras contas",color:"var(--outros)"}};
const SPLIT = {me:"Só eu", half:"Dividir ½", hel:"Helena 100%"};
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const fmt = v => BRL.format(Math.round((v||0)*100)/100).replace(/ /g," ");
const fmtK = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil" : Math.round(v).toLocaleString("pt-BR");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function mLabel(ym){const [y,m]=ym.split("-").map(Number);return MESES[m-1]+" "+y}
function mShort(ym){const [y,m]=ym.split("-").map(Number);return MES3[m-1]+"/"+String(y).slice(2)}
/* A fatura do mês M vence no próprio mês M (ex.: aba Novembro = fatura que vence em novembro). */
function dueName(ym){return MESES[+ym.split("-")[1]-1]}
function parseMoney(s){
  if(typeof s==="number")return s; s=String(s||"").replace(/R\$|\s/g,"");
  let neg=/^-|-$/.test(s); s=s.replace(/-/g,"");
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const v=parseFloat(s); return isNaN(v)?null:(neg?-v:v);
}
function parseDateBR(s){ // -> YYYY-MM-DD or ""
  s=String(s||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  return "";
}
const fmtDate = iso => iso?iso.split("-").reverse().join("/"):"";
function norm(s){return String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function baseKey(d){return norm(d).replace(/PARCELA/g,"").replace(/\d{1,2}\s*\/\s*\d{1,2}/g,"").replace(/\/\s*2\b/g,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function instOf(d){const m=String(d).match(/(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/);if(!m)return null;const n=+m[1],N=+m[2];return (n>=1&&n<=N&&N>=2&&N<=48)?{n,N}:null}
function stripInst(d){return String(d).replace(/\s*-?\s*parcela\s*/i," ").replace(/\s*\d{1,2}\s*\/\s*\d{1,2}\s*$/,"").trim()}
const myShare = it => it.sp==="me"?it.v:it.sp==="half"?it.v/2:0;
const helShare = it => it.v-myShare(it);
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const todayYM = today().slice(0,7);

/* ---------- categorias ---------- */
/* Nomes da planilha original (lista suspensa da coluna CATEGORIAS) + Mercado, Viagens e Outros, que já têm lançamentos. */
const DEFAULT_CATS=["Alimentação / Lanches e Cafés","Mercado","Lazer / Assinaturas","Lazer / Hobbies","Transporte / Manutenção do Veículo","Gasolina","Saúde","Casa / Manutenção e Reparo","Compras Online","Compras Parceladas","Internet","Estudos","Presentes","Imposto/Tarifa","Viagens","Outros"];
const CAT_RENAME={"Alimentação":"Alimentação / Lanches e Cafés","Assinaturas":"Lazer / Assinaturas","Lazer":"Lazer / Hobbies","Transporte":"Transporte / Manutenção do Veículo","Casa":"Casa / Manutenção e Reparo","Compras":"Compras Online","Internet e celular":"Internet","Família e presentes":"Presentes","Tarifas":"Imposto/Tarifa"};
const KW=[
 ["Gasolina",["GASOLINA","COMBUST","ABASTEC","POSTO ","SHELL","IPIRANGA","PETROBRAS"]],
 ["Viagens",["LATAM","BOOKING","HOTEL","HOSPEDAGEM","AIRBNB","MALA","SERRA VERDE","PASSAGEM","AZUL ","GOL "]],
 ["Mercado",["MATEUS","FRIBAL","MERCADO ","SUPERMERC","ASSAI","CARREFOUR","ATACAD","LEAO","PANIFICADORA","RANCHO"]],
 ["Lazer / Assinaturas",["NETFLIX","SPOTIFY","SPOTFY","MELI+","MELIMAIS","PRIME","YOUTUBE","CRUNCH","DUOLINGO","CLUBE IFOOD","DISNEY","HBO","ICLOUD","APPLE.COM","GOOGLE","CHATGPT","OPENAI","CLAUDE","STEAM"]],
 ["Internet",["ESTRELA","NUCEL","TIM ","INTERNET","RECARGA","CLARO","VIVO"]],
 ["Imposto/Tarifa",["SEGURO","IOF","ANUIDADE","TARIFA","JUROS","PIX CREDITO","RIFA","CRP","IMPOSTO"]],
 ["Saúde",["FARMAC","DROGA","REMEDI","DENTIST","SELFIT","ACADEMIA","PRE TREINO","GROWTH","PAGUE MENOS","PILATES","NATACAO","PLANO DE SAUDE","LABORAT","CLINICA","PANVEL","EXTRAFARMA"]],
 ["Estudos",["ESTRATEGIA","POS ","CURSO","LIVRO","LIVRARIA","CNU","HOTMART","UDEMY"]],
 ["Transporte / Manutenção do Veículo",["UBER","99APP","99 ","ESTACIONAMENT","PNEU","BALANCEAMENTO","BATERIA","OLEO","PASTILHA","OFICINA","AUTO PECAS","LAVA JATO","PEDAGIO"]],
 ["Presentes",["MAMAE","PRESENTE","TITIA"]],
 ["Lazer / Hobbies",["CINEMA","INGRESSO","KART","LUDORAMA","SHOW","MUSEU","CONFRA","FLAMENGO","SYMPLA","CINEPOLIS","PLAYSTATION","NINTENDO"]],
 ["Casa / Manutenção e Reparo",["REFORMA","PINTURA","POTIGUAR","FERRAMENTA","LAMPADA","LEROY","COLCHAO","CAMA ","TOALHA","DAISO","REINO ANIMAL","PET","LUZ","ENERGIA","EQUATORIAL"]],
 ["Compras Online",["AMAZON","AMAZONMKT","SHOPEE","SHOPPEE","MERCADOLIVRE","MERCADO LIVRE","AMERICANAS","MAGALU","HERING","LUPO","RENNER","C&A","RIACHUELO","CENTAURO","NETSHOES","ALIEXPRESS","SHEIN","SAMSUNG","KABUM"]],
 ["Alimentação / Lanches e Cafés",["IFOOD","CAFE","LANCHE","HAMB","BURGER","BURGUER","PIZZA","SUSHI","SORVETE","PICOLE","RESTAURANTE","BAR ","GRILL","COREANO","JAPA","SUBWAY","MC DONALD","MCDONALD","POPEYES","KFC","CHURRASC","BIEL","GENUINO","FROSTY","PADARIA","ACAI","DOCE","BISTRO","ESPETO","LANCHONETE"]],
];
function kwCat(d){const s=" "+norm(d)+" ";for(const [c,ks] of KW)for(const k of ks)if(s.includes(k))return c;return null}
const collator=new Intl.Collator("pt-BR",{sensitivity:"base"});
function catsSorted(){const cs=[...new Set(cfg().cats)];return cs.filter(c=>c!=="Outros").sort(collator.compare).concat(cs.includes("Outros")?["Outros"]:[])}
function catExists(name){return cfg().cats.some(c=>norm(c)===norm(name))}
function catOptions(sel){
  const cs=catsSorted();if(sel&&!cs.includes(sel))cs.push(sel);
  return cs.map(c=>`<option value="${esc(c)}" ${c===sel?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new__">+ Criar nova categoria</option>`;
}
function catUsage(){const u={};for(const m of Object.values(S.months))for(const it of m.items||[]){const c=it.cat||"Outros";u[c]=(u[c]||0)+1}for(const r of cfg().recs)u[r.cat]=(u[r.cat]||0)+0;return u}

/* ---------- state ---------- */
const TABS=["inicio","lanc","painel","importar","ajustes","helena"];
const S = {
  db:null, owner:false, canEdit:false, ready:false, error:null,
  months:{}, config:null, helDocs:{}, ym:todayYM, tab:"inicio",
  filterCard:"all", filterCat:"", query:"", rangeN:12, catOpen:null, imp:null, dl:null,
  open:{}, pending:0, syncErr:false, hideVals:false,
};
const tab0=(location.hash||"").replace("#","");
if(TABS.includes(tab0))S.tab=tab0;
try{const t=localStorage.getItem("gm.tab");if(t&&!tab0&&TABS.includes(t))S.tab=t;const r=localStorage.getItem("gm.range");if(r)S.rangeN=+r;
  S.open=JSON.parse(localStorage.getItem("gm.open")||"{}");S.hideVals=localStorage.getItem("gm.hide")==="1"}catch(e){}
if(S.tab==="mes")S.tab="inicio";
/* theme: auto (segue o aparelho) / claro / escuro */
const THEMES=[["auto","Automático"],["light","Claro"],["dark","Escuro"]];
S.theme="auto";try{S.theme=localStorage.getItem("gm.theme")||"auto"}catch(e){}
function applyTheme(){const root=document.documentElement;if(S.theme==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",S.theme)}
applyTheme();
document.body.classList.toggle("hide-vals",S.hideVals);

function cfg(){const c=S.config||{};return {cats:c.cats&&c.cats.length?c.cats:DEFAULT_CATS.slice(),recs:c.recs||[],incDefault:c.incDefault||[],planDefault:c.planDefault||[],pix:c.pix||"",catV:c.catV||(S.config?1:2)}}
function cfgClone(){return JSON.parse(JSON.stringify(Object.assign({},S.config||{},cfg())))}
function getMonth(ym){return S.months[ym]||null}
function blankMonth(ym){return {ym,items:[],inc:[],plan:[],adj:[],rec:{},hel:{paid:false}}}
function monthOrBlank(ym){return S.months[ym]?JSON.parse(JSON.stringify(S.months[ym])):blankMonth(ym)}

/* ---------- derived numbers ---------- */
function totals(doc){
  const t={nu:{tot:0,me:0,hel:0,n:0},inter:{tot:0,me:0,hel:0,n:0},outros:{tot:0,me:0,hel:0,n:0},inc:0,plan:0,me:0,hel:0,adj:0};
  if(!doc)return Object.assign(t,{sobra:0,helOwes:0,saidas:0});
  for(const it of doc.items||[]){const c=t[it.c]||t.outros;c.tot+=it.v;c.me+=myShare(it);c.hel+=helShare(it);c.n++;t.me+=myShare(it);t.hel+=helShare(it)}
  for(const x of doc.inc||[])t.inc+=x.v; for(const x of doc.plan||[])t.plan+=x.v; for(const a of doc.adj||[])t.adj+=a.v;
  t.saidas=t.me+t.plan; t.sobra=t.inc-t.saidas; t.helOwes=t.hel+t.adj; return t;
}
function catTotals(doc){const m={};for(const it of (doc&&doc.items)||[]){const s=myShare(it);if(s>0)m[it.cat||"Outros"]=(m[it.cat||"Outros"]||0)+s}return m}
function curYM(){ // último mês já iniciado (com entradas), no máximo um mês à frente do calendário
  const lim=addM(todayYM,1);const ks=Object.keys(S.months).filter(k=>k<=lim&&(S.months[k].inc||[]).length).sort();
  return ks.length&&ks[ks.length-1]>todayYM?ks[ks.length-1]:todayYM;
}
function histMonths(){const cur=curYM();return Object.keys(S.months).filter(k=>k<=cur&&((S.months[k].items||[]).length||(S.months[k].inc||[]).length)).sort()}
function pendingRecs(ym){
  const doc=getMonth(ym);const done=(doc&&doc.rec)||{};
  return cfg().recs.filter(r=>r.on&&(!r.from||ym>=r.from)&&(!r.until||ym<=r.until)&&!done[r.id]);
}
function learned(){
  const map=new Map();
  for(const ym of Object.keys(S.months).sort())for(const it of S.months[ym].items||[]){const k=baseKey(it.d);if(k)map.set(k,{cat:it.cat,sp:it.sp,c:it.c,d:stripInst(it.d)})}
  return map;
}
let _learn=null; function learn(){return _learn||(_learn=learned())}
function suggestCat(d){const k=baseKey(d);const L=learn();let c=null;if(L.has(k))c=L.get(k).cat;else{const first=k.split(" ").slice(0,2).join(" ");for(const [kk,v] of L)if(first&&kk.startsWith(first)){c=v.cat;break}}
  c=c||kwCat(d)||"Outros";return CAT_RENAME[c]||c}
function suggestSplit(d){const L=learn().get(baseKey(d));return L?L.sp:"me"}

/* ---------- persistence & sync status ---------- */
function setSync(){
  const el=document.getElementById("sync");if(!el)return;
  let s="ok",t="Sincronizado";
  if(!navigator.onLine){s="offline";t=S.pending?`Offline · ${S.pending} pendente${S.pending>1?"s":""}`:"Offline"}
  else if(S.syncErr){s="error";t="Erro ao salvar"}
  else if(S.pending){s="saving";t="Salvando…"}
  el.dataset.s=s;el.querySelector("span").textContent=t;el.setAttribute("aria-label",t);el.hidden=!S.canEdit;
}
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);
async function track(p){S.pending++;S.syncErr=false;setSync();try{await p}catch(e){S.syncErr=true;throw e}finally{S.pending=Math.max(0,S.pending-1);setSync()}}
async function saveMonth(doc,quiet){
  doc.updatedAt=new Date().toISOString();
  S.months[doc.ym]=doc; _learn=null; if(!quiet)render();
  if(!S.db||!S.canEdit){toast("Sem permissão para salvar");return}
  try{await track(S.db.doc("months/"+doc.ym).set(doc)); syncHelena([doc.ym]);}
  catch(e){console.error(e);toast("Não foi possível salvar. Confira a conexão e tente de novo.")}
}
async function saveConfig(c,quiet){
  S.config=c; if(!quiet)render();
  if(!S.db||!S.canEdit)return;
  try{await track(S.db.doc("config/main").set(c))}catch(e){console.error(e);toast("Não foi possível salvar os ajustes.")}
}
function helDoc(ym){
  const doc=getMonth(ym); if(!doc)return null; const t=totals(doc);
  const items=(doc.items||[]).filter(it=>it.sp!=="me").map(it=>({d:it.d,v:r2(helShare(it)),total:it.v,kind:it.sp,c:it.c}));
  return {ym,items,adj:(doc.adj||[]).map(a=>({d:a.d,v:a.v})),total:r2(t.helOwes),paid:!!(doc.hel&&doc.hel.paid),paidAt:(doc.hel&&doc.hel.paidAt)||null};
}
let syncTimer=null;
function syncHelena(list){
  if(!S.db||!S.canEdit)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    const yms=list||Object.keys(S.months);
    for(const ym of yms){const want=helDoc(ym);if(!want)continue;const have=S.helDocs[ym];
      if(!have||JSON.stringify(have)!==JSON.stringify(want)){S.helDocs[ym]=want;try{await S.db.doc("helena/"+ym).set(want)}catch(e){}}}
  },list?300:2500);
}
/* categorias: migração única para os nomes da planilha */
let migrating=false;
async function migrateCats(){
  if(migrating||!S.canEdit||cfg().catV>=2)return;migrating=true;
  try{
    const ren=c=>CAT_RENAME[c]||c;
    for(const ym of Object.keys(S.months)){const d=monthOrBlank(ym);let ch=false;
      for(const it of d.items||[]){const n=ren(it.cat||"Outros");if(n!==it.cat){it.cat=n;ch=true}}
      if(ch)await saveMonth(d,true)}
    const c=cfgClone();const set=new Set(DEFAULT_CATS);
    for(const x of c.cats){const n=ren(x);if(!set.has(n)&&!DEFAULT_CATS.some(d=>norm(d)===norm(n)))set.add(n)}
    c.cats=[...set];c.recs.forEach(r=>r.cat=ren(r.cat));c.catV=2;
    await saveConfig(c,true);render();
  }finally{migrating=false}
}

/* ---------- Firebase ---------- */
let FBAPP=null,AUTH=null,FS=null;
function cleanJSON(d){return JSON.parse(JSON.stringify(d))}
function makeDB(uid,token){
  const path=p=>p.startsWith("helena")?p.replace(/^helena/,"shares/"+token+"/months"):"users/"+uid+"/"+p;
  const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
  return {
    doc(p){const ref=fsDoc(FS,path(p));return {set:d=>setDoc(ref,cleanJSON(d)),onSnapshot:(cb,err)=>fsSnap(ref,s=>cb(wrapDoc(s)),err)}},
    collection(p){const ref=fsCol(FS,path(p));const q={limit:()=>q,onSnapshot:(cb,err)=>fsSnap(ref,s=>cb({docs:s.docs.map(wrapDoc)}),err)};return q}
  };
}
function downloadFile({filename,data,type}){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||(filename.endsWith(".json")?"application/json":"text/csv;charset=utf-8")});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve({status:"saved"});
}
function randToken(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,"0")).join("").slice(0,24)}
async function boot(){
  S.dl={save:downloadFile};
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey||/COLE/.test(FIREBASE_CONFIG.apiKey)){S.error="setup";render();return}
  try{
    FBAPP=initializeApp(FIREBASE_CONFIG);AUTH=getAuth(FBAPP);
    FS=initializeFirestore(FBAPP,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  }catch(e){console.error(e);S.error="setup";render();return}
  const hm=(location.hash||"").match(/^#h=([A-Za-z0-9]{12,40})$/);
  if(hm){ // Helena: só leitura, sem login
    S.canEdit=false;S.helenaMode=true;S.tab="helena";S.db=makeDB("_",hm[1]);
    S.db.collection("helena").onSnapshot(snap=>{S.helDocs={};snap.docs.forEach(d=>{if(d.exists)S.helDocs[d.id]=d.data()});if(!S.userNav){const ks=Object.keys(S.helDocs).filter(k=>k<=addM(todayYM,1)&&((S.helDocs[k].items||[]).length||(S.helDocs[k].adj||[]).length)).sort();if(ks.length)S.ym=ks[ks.length-1]}S.ready=true;render()},()=>{S.error="nodb";render()});
    return;
  }
  getRedirectResult(AUTH).catch(()=>{});
  onAuthStateChanged(AUTH,async u=>{
    S.authUser=u;
    if(!u){S.needLogin=true;S.ready=false;S.canEdit=false;render();return}
    S.needLogin=false;
    try{
      const metaRef=fsDoc(FS,"users/"+u.uid+"/meta/share");const ms=await getDoc(metaRef);let token=ms.exists()?ms.data().token:null;
      if(!token){token=randToken();await setDoc(fsDoc(FS,"shares/"+token),{owner:u.uid,createdAt:new Date().toISOString()});await setDoc(metaRef,{token})}
      S.token=token;
    }catch(e){console.error(e);S.error="rules";render();return}
    S.db=makeDB(u.uid,S.token);S.owner=true;S.canEdit=true;setSync();
    const db=S.db;
    let got={m:false,c:false};
    const ready=()=>{if(got.m&&got.c){S.ready=true;render();migrateCats()}};
    db.doc("config/main").onSnapshot(s=>{S.config=s.exists?s.data():null;got.c=true;ready()},e=>{console.error(e);S.error="rules";render()});
    db.collection("months").onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});S.months=m;_learn=null;
      if(!S.userNav)S.ym=curYM();got.m=true;ready();
    },e=>{console.error(e);S.error="rules";render()});
    db.collection("helena").onSnapshot(snap=>{const h={};snap.docs.forEach(d=>{if(d.exists)h[d.id]=d.data()});S.helDocs=h;syncHelena()},()=>{});
  });
}
async function doLogin(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(AUTH,p)}catch(e){
    const c=(e&&e.code)||"";
    if(/popup-blocked|operation-not-supported/.test(c)){await signInWithRedirect(AUTH,p)}
    else if(c==="auth/unauthorized-domain")toast("Domínio não autorizado no Firebase (Authentication > Configurações > Domínios autorizados)");
    else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")toast("Não foi possível entrar: "+(c||e.message));
  }
}
async function importBackup(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast("Arquivo inválido");return}
  if(!data||data.app!=="gasto-mensal"||!data.months){toast("Esse arquivo não é um backup do Gasto Mensal");return}
  const n=Object.keys(data.months).length;
  if(!confirm(`Importar ${n} meses do backup de ${new Date(data.exportedAt).toLocaleString("pt-BR")}? Meses com o mesmo nome serão substituídos.`))return;
  toast("Importando…");
  try{
    for(const ym of Object.keys(data.months)){const d=Object.assign({},data.months[ym]);delete d.__name__;await track(S.db.doc("months/"+ym).set(cleanJSON(d)))}
    if(data.config){const c=Object.assign({},data.config);if(!c.catV)c.catV=1;await track(S.db.doc("config/main").set(cleanJSON(c)))}
    toast(n+" meses importados");setTimeout(()=>{syncHelena();migrateCats()},800);
  }catch(e){console.error(e);toast("Falhou no meio da importação. Tente de novo.")}
}

  const groups=activeInstallments();

/* charts (SVG) */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function svgFrame(W,H,body){return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(W,480)}px" role="img">${body}</svg>`}
function bars(W,H,L,R,T,B,vals,labels,tips,opts={}){
  const hasNeg=vals.some(v=>v<0);
  const mx=niceMax(Math.max(0,opts.max||0,...vals)),mn=hasNeg?-niceMax(Math.max(0,...vals.map(v=>-v))):0;
  const y=v=>T+(mx-v)/((mx-mn)||1)*(H-T-B);const bw=(W-L-R)/Math.max(1,vals.length);
  let g="";const ticks=hasNeg?[mn,0,mx]:[0,mx/2,mx];
  ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v===0?"ink-3":"grid"})"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`});
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;const y0=y(0),y1=y(v);const top=Math.min(y0,y1),hh=Math.abs(y1-y0);
    if(hh>0.5){const r=Math.min(4,w/2,hh);const neg=v<0;
      const path=neg?`M${x},${top} h${w} v${hh-r} q0,${r} -${r},${r} h-${w-2*r} q-${r},0 -${r},-${r} Z`:`M${x},${top+hh} v-${hh-r} q0,-${r} ${r},-${r} h${w-2*r} q${r},0 ${r},${r} v${hh-r} Z`;
      g+=`<path d="${path}" fill="var(--${neg?"bar-neg":"bar"})"/>`}
    if(opts.line&&opts.line[i]>0)g+=`<line x1="${L+i*bw+2}" x2="${L+(i+1)*bw-2}" y1="${y(opts.line[i])}" y2="${y(opts.line[i])}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>`;
    g+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tips[i])}" ${opts.goto?`data-goto="${opts.goto[i]}" style="cursor:pointer"`:""}/>`;
    if(vals.length<=13||i%2===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-9}" text-anchor="middle" ${opts.cur===i?'style="fill:var(--ink);font-weight:700"':""}>${labels[i]}</text>`});
  return svgFrame(W,H,g);
}
function chartSobra(months){

  const tt=months.map(m=>totals(S.months[m]));

/* ---------- leitura de PDF (Nubank / Inter) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s)})}
async function loadPdfJs(){if(!window.pdfjsLib){await loadScript("lib/pdf.min.js")}window.pdfjsLib.GlobalWorkerOptions.workerSrc="lib/pdf.worker.min.js";return window.pdfjsLib}
async function pdfLines(bytes,password){
  const pdfjs=await loadPdfJs();
  const doc=await pdfjs.getDocument({data:new Uint8Array(bytes.slice(0)),password:password||undefined,isEvalSupported:false}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p);const tc=await page.getTextContent();const rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str,w:it.width||0})}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.items.sort((a,b)=>a.x-b.x);let s="",end=null;for(const it of r.items){if(end!=null&&it.x-end>0.8)s+=" ";s+=it.s;end=it.x+it.w}lines.push(s.replace(/\s+/g," ").trim())}}
  try{doc.destroy()}catch(_){}
  return lines;
}
let PW=null;
function askPassword(msg){return new Promise(res=>{PW=res;openDialog(`<div class="row" style="justify-content:space-between"><h2>PDF com senha</h2><button class="iconbtn" data-act="pwCancel" aria-label="Fechar">${ico("x")}</button></div>
  <p style="margin:0">${esc(msg)} A senha costuma vir indicada no e-mail do banco. Ela é usada só para abrir o arquivo neste aparelho e não fica salva.</p>
  <label class="field"><span>Senha do PDF</span><input id="pw-in" type="password" autocomplete="off"></label>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="pwCancel">Cancelar</button><button class="btn primary" data-act="pwOk">Abrir</button></div>`)})}
async function readPdf(bytes){
  let pw=null;
  for(let t=0;t<5;t++){
    try{return await pdfLines(bytes,pw)}catch(e){
      if(e&&e.name==="PasswordException"){pw=await askPassword(pw?"Senha incorreta. Tente de novo.":"Este PDF está protegido por senha.");if(pw==null)return null;continue}
      throw e}}
  return null;
}
const MON={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
const pad2=n=>String(n).padStart(2,"0");
function yearFor(mon,due){if(!due)return new Date().getFullYear();const [y,m]=due.split("-").map(Number);return mon>m?y-1:y}
function detectBank(lines){const t=norm(lines.join(" "));if(/NU PAGAMENTOS|NUBANK/.test(t))return "nu";if(/BANCO INTER|INTER LOOP|SUPER APP/.test(t))return "inter";return null}
function cleanInst(d){
  let inst=null,m;
  if((m=d.match(/\(\s*Parcela\s+(\d{1,2})\s+de\s+(\d{1,2})\s*\)/i))){inst={n:+m[1],N:+m[2]};d=d.replace(m[0],"")}
  else if((m=d.match(/\s*-?\s*Parcela\s+(\d{1,2})\s*\/\s*(\d{1,2})/i))){inst={n:+m[1],N:+m[2]};d=d.replace(m[0],"")}
  let ant=false;if(/^Antecipad[ao]\s*-\s*/i.test(d)){ant=true;d=d.replace(/^Antecipad[ao]\s*-\s*/i,"")}
  d=d.replace(/\s+-\s*$/,"").replace(/\s+/g," ").trim();
  if(ant)d+=" (antecipada)";
  if(inst&&inst.n>=1&&inst.n<=inst.N&&inst.N>=2)d+=` ${inst.n}/${inst.N}`;else inst=null;
  return {d,inst};
}
function parseNubank(lines){
  const txt=lines.join("\n");let due=null,m;
  if((m=txt.match(/Data de vencimento:?\s*(\d{2})\s+([A-Z]{3})\s+(\d{4})/i))||(m=txt.match(/FATURA\s+(\d{2})\s+([A-Z]{3})\s+(\d{4})/)))due=`${m[3]}-${pad2(MON[m[2].toUpperCase()])}-${m[1]}`;
  const rows=[];let holder=null,inPay=false,started=false,holderSum=0,holders=0;
  const re=new RegExp("^(\\d{2})\\s+("+Object.keys(MON).join("|")+")\\s+(?:[^\\w\\s]{2,}\\s*(\\d{4})\\s+)?(.+?)\\s+([−–-])?\\s?R\\$\\s?([\\d.]+,\\d{2})$","i");
  for(const l of lines){
    if(/^TRANSA[ÇC][ÕO]ES/i.test(l)){started=true;continue}
    if(!started)continue;
    if(/^Pagamentos\b/i.test(l)){inPay=true;continue}
    const t=l.match(re);
    if(!t){const hm=l.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .']{2,60}?)\s+R\$\s?([\d.]+,\d{2})$/);if(hm&&!/TOTAL|SALDO|LIMITE/i.test(hm[1])){holder=hm[1].trim();inPay=false;holderSum+=parseMoney(hm[2]);holders++}continue}
    if(inPay)continue;
    const raw=t[4];if(/^Pagamento em\b/i.test(raw))continue;
    let v=parseMoney(t[6]);if(t[5])v=-v;
    const mon=MON[t[2].toUpperCase()];const dt=`${yearFor(mon,due)}-${pad2(mon)}-${t[1]}`;
    const c=cleanInst(raw);rows.push({d:c.d,v:r2(v),dt,date:fmtDate(dt),card4:t[3]||"",holder,inst:c.inst});
  }
  let total=holders?r2(holderSum):null;
  if(total==null){const a=txt.match(/Total de compras[^\n]*?R\$\s?([\d.]+,\d{2})/i),b=txt.match(/Outros lan[çc]amentos\s+R\$\s?([\d.]+,\d{2})/i);if(a)total=r2(parseMoney(a[1])+(b?parseMoney(b[1]):0))}
  return {bank:"nu",due,total,rows};
}
function parseInter(lines){
  const txt=lines.join("\n");let due=null,m;
  if((m=txt.match(/Data de Vencimento\s*\n?\s*(\d{2})\/(\d{2})\/(\d{4})/i))||(m=txt.match(/\b(\d{2})\/(\d{2})\/(\d{4})\s+R\$\s?[\d.]+,\d{2}/)))due=`${m[3]}-${m[2]}-${m[1]}`;
  let total=null;if((m=txt.match(/Despesas do m[eê]s\s+R\$\s?([\d.]+,\d{2})/i))||(m=txt.match(/Total da sua fatura\s*\n?\s*R\$\s?([\d.]+,\d{2})/i)))total=parseMoney(m[1]);
  const rows=[];let card4="";
  const re=/^(\d{1,2}) de ([a-zç]{3})\.? (\d{4}) (.+?)\s+(\+|-)?\s?R\$ ?([\d.]+,\d{2})$/i;
  for(const l of lines){
    const cm=l.match(/^CART[ÃA]O\s+\d{4}\*+(\d{4})/i);if(cm){card4=cm[1];continue}
    const t=l.match(re);if(!t)continue;
    const raw=t[4].replace(/\s+-\s*$/,"").trim();
    if(t[5]==="+"&&/PAGAMENTO/i.test(raw))continue;
    let v=parseMoney(t[6]);if(t[5]==="+")v=-v;
    const mon=MON[t[2].toUpperCase().replace("Ç","C")]||MON[norm(t[2])];const dt=`${t[3]}-${pad2(mon)}-${pad2(t[1])}`;
    const c=cleanInst(raw);rows.push({d:c.d,v:r2(v),dt,date:fmtDate(dt),card4,holder:null,inst:c.inst});
  }
  return {bank:"inter",due,total,rows};
}
const STOP=new Set(["PARCELA","NUPAY","ANTECIPADA","COM","BR","LTDA","STORE","SHOP","SAO","LUIS"]);
function toks(d){return new Set(baseKey(d).split(" ").filter(w=>w.length>=4&&!STOP.has(w)))}
function markDups(I){
  const doc=getMonth(I.ym)||{items:[]};const ex=(doc.items||[]).filter(x=>x.c===I.card);const used=new Set();
  for(const r of I.rows){
    r.dup=null;r.maybe=null;r.moveFrom=null;r.on=true;
    const rt=toks(r.d);
    let j=ex.findIndex((x,k)=>!used.has(k)&&Math.abs(x.v-r.v)<0.011&&([...toks(x.d)].some(w=>rt.has(w))||(x.rec&&baseKey(x.d).split(" ")[0]===baseKey(r.d).split(" ")[0])));
    if(j<0&&r.inst)j=ex.findIndex((x,k)=>!used.has(k)&&x.inst&&x.inst.n===r.inst.n&&x.inst.N===r.inst.N&&Math.abs(x.v-r.v)<=Math.max(0.05,Math.abs(r.v)*0.01));
    if(j>=0){used.add(j);r.dup=ex[j].d;r.on=false;continue}
    j=ex.findIndex((x,k)=>!used.has(k)&&Math.abs(x.v-r.v)<0.011);
    if(j>=0){used.add(j);r.maybe=ex[j].d;r.on=false;continue}
    if(r.inst){ // parcela prevista em outro mês (projeção ou antecipação)
      for(let k=1;k<=r.inst.N&&!r.moveFrom;k++)for(const dir of [1,-1]){const m=addM(I.ym,k*dir);const d=getMonth(m);if(!d)continue;
        const x=(d.items||[]).find(x=>x.c===I.card&&x.inst&&x.inst.n===r.inst.n&&x.inst.N===r.inst.N&&Math.abs(x.v-r.v)<=Math.max(0.05,Math.abs(r.v)*0.01));
        if(x&&dir===1){r.moveFrom={ym:m,id:x.id,g:x.inst.g||null};break}}
    }
  }
}
function applyImport(I,sel){
  const docs={};const get=m=>docs[m]||(docs[m]=monthOrBlank(m));
  for(const r of sel)if(r.moveFrom){const d=get(r.moveFrom.ym);d.items=d.items.filter(x=>x.id!==r.moveFrom.id)}
  const find=(m,n,N,v)=>{const d=get(m);return (d.items||[]).find(x=>x.c===I.card&&x.inst&&x.inst.n===n&&x.inst.N===N&&Math.abs(x.v-v)<=Math.max(0.05,Math.abs(v)*0.01))};
  let n=0;
  for(const r of sel){
    const it={id:rid(),d:r.d,v:r.v,c:I.card,cat:r.cat,sp:r.sp,src:I.pdf?"pdf":"import",ts:new Date().toISOString()};if(r.dt)it.dt=r.dt;if(r.card4)it.card4=r.card4;
    if(r.inst){let g=(r.moveFrom&&r.moveFrom.g)||null;
      for(let k=r.inst.n+1;k<=r.inst.N&&!g;k++){const f=find(addM(I.ym,k-r.inst.n),k,r.inst.N,r.v);if(f&&f.inst.g)g=f.inst.g}
      it.inst={n:r.inst.n,N:r.inst.N,g:g||rid()}}
    get(I.ym).items.push(it);n++;
    if(it.inst){const base=stripInst(it.d.replace(/\s*\(antecipada\)/i,""));
      const here=new Set(sel.filter(o=>o!==r&&o.inst&&o.inst.N===it.inst.N&&Math.abs(o.v-it.v)<=Math.max(0.05,Math.abs(it.v)*0.01)&&baseKey(stripInst(o.d.replace(/\s*\(antecipada\)/i,""))).split(" ")[0]===baseKey(base).split(" ")[0]).map(o=>o.inst.n));
      if(/\(antecipada\)/i.test(it.d))continue; // parcela adiantada: as seguintes já vêm na mesma fatura ou foram antecipadas
      for(let k=it.inst.n+1;k<=it.inst.N;k++){if(here.has(k))continue;const m=addM(I.ym,k-it.inst.n);if(find(m,k,it.inst.N,it.v))continue;
        const f=JSON.parse(JSON.stringify(it));f.id=rid();f.d=`${base} ${k}/${it.inst.N}`;f.inst={n:k,N:it.inst.N,g:it.inst.g};delete f.dt;delete f.ts;f.proj=true;get(m).items.push(f)}}
  }
  for(const m in docs)saveMonth(docs[m],true);
  render();return n;
}
async function importPdfFile(file,expect){
  toast("Lendo o PDF…");
  let lines;try{lines=await readPdf(await file.arrayBuffer())}catch(e){console.error(e);toast("Não consegui ler esse PDF. Confira se é a fatura em PDF do banco.");return}
  if(!lines){toast("Leitura cancelada");return}
  const bank=detectBank(lines)||expect;
  if(bank!==expect&&!confirm(`Esse PDF parece ser uma fatura do ${CARDS[bank].name}, não do ${CARDS[expect].name}. Ler como ${CARDS[bank].name}?`))return;
  const P=bank==="inter"?parseInter(lines):parseNubank(lines);
  if(!P.rows.length){toast("Não encontrei lançamentos nesse PDF. O layout pode ter mudado; me avise.");return}
  const ym=P.due?P.due.slice(0,7):S.ym;
  const rows=P.rows.map(r=>{let sp=suggestSplit(r.d);if(r.holder&&/HELENA/.test(norm(r.holder)))sp="hel";return Object.assign(r,{cat:suggestCat(r.d),sp,on:true})});
  S.imp={card:bank,ym,text:"",rows,skipNeg:true,pdf:{bank,due:P.due,total:P.total,file:file.name}};
  markDups(S.imp);render();
  setTimeout(()=>{const t=document.querySelector(".imp-table");if(t)t.closest("section").scrollIntoView({behavior:"smooth",block:"start"})},50);
  const nDup=rows.filter(r=>r.dup||r.maybe).length;
  toast(`${rows.length} lançamentos lidos${nDup?` · ${nDup} já existiam`:""}`);
}
function monthOptions(sel){const out=[];for(let k=-14;k<=6;k++){const m=addM(todayYM,k);out.push(`<option value="${m}" ${m===sel?"selected":""}>${mLabel(m)}</option>`)}if(!out.join("").includes(`"${sel}"`))out.push(`<option value="${sel}" selected>${mLabel(sel)}</option>`);return out.join("")}
function parseImport(text,skipNeg){
  const lines=String(text).replace(/^﻿/,"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return [];
  const first=lines[0];const delim=(first.split(";").length>first.split(",").length&&first.includes(";"))?";":(first.includes("\t")?"\t":",");
  const splitCSV=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const hdr=splitCSV(first).map(norm);
  const iDate=hdr.findIndex(x=>/^(DATE|DATA)/.test(x)),iDesc=hdr.findIndex(x=>/(TITLE|DESCRI|LANCAMENTO|ESTABELECIMENTO|HISTORICO)/.test(x)),iVal=hdr.findIndex(x=>/(AMOUNT|VALOR)/.test(x));
  const iCat=hdr.findIndex(x=>/^CATEGORIA/.test(x)),iSp=hdr.findIndex(x=>/(QUEM|DIVIS|DIVID)/.test(x)),iPar=hdr.findIndex(x=>/^PARCELA/.test(x));
  const spOf=s=>{const n=norm(s);if(!n)return null;if(/HELENA|DELA|100/.test(n))return "hel";if(/METADE|DIVID|1\/2|½|50/.test(n))return "half";if(/EU|MEU|SO EU/.test(n))return "me";return null};
  const rows=[];
  if(iDesc>=0&&iVal>=0){
    for(const l of lines.slice(1)){const c=splitCSV(l);let v=parseMoney(c[iVal]);if(v==null)continue;
      let d=c[iDesc]||"";if(v<0||/PAGAMENTO RECEBIDO|ESTORNO/i.test(norm(d))){if(skipNeg)continue}
      if(iPar>=0&&c[iPar]&&/\d+\s*\/\s*\d+/.test(c[iPar])&&!instOf(d))d=d+" "+c[iPar].trim();
      const catIn=iCat>=0?(c[iCat]||"").trim():"";let catM=null;
      if(catIn){const r=CAT_RENAME[catIn]||catIn;catM=cfg().cats.find(x=>norm(x)===norm(r))||r}
      rows.push({d,v:Math.abs(v)*(v<0?-1:1),date:iDate>=0?c[iDate]:"",catIn:catM,spIn:iSp>=0?spOf(c[iSp]):null})}
  } else {
    for(const l of lines){const m=l.match(/^(.*?)[\s\t]+(-\s*)?(?:R\$\s*)?(-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d+\.\d{2}|-?\d+,\d{2})\s*$/);if(!m)continue;
      let d=m[1].replace(/R\$\s*$/,"").trim();let v=parseMoney((m[2]?"-":"")+m[3]);if(v==null)continue;
      let date="";const dm=d.match(/^(\d{1,2}[\/\s](?:\d{1,2}|[A-Za-zç]{3})(?:[\/\s]\d{2,4})?)\s+/);if(dm){date=dm[1];d=d.slice(dm[0].length)}
      if(v<0||/PAGAMENTO|ESTORNO/i.test(norm(d))){if(skipNeg)continue}
      rows.push({d,v,date})}
  }
  return rows.map(r=>{const inst=instOf(r.d);let d=r.d.replace(/\s*-\s*Parcela\s*/i," ").replace(/\s+/g," ").trim();return {d,v:r2(r.v),date:r.date,dt:parseDateBR(r.date),inst,cat:r.catIn||suggestCat(d),sp:r.spIn||suggestSplit(d),on:true}});
}

async function createCategory(){
  const el=document.getElementById("nc-name");const name=(el.value||"").trim().replace(/\s+/g," ");const msg=document.getElementById("nc-msg");
  if(!name){msg.textContent="Digite um nome.";return}
  if(name.length>40){msg.textContent="Use até 40 caracteres.";return}
  const ex=cfg().cats.find(c=>norm(c)===norm(name));
  const final=ex||name;
  if(!ex){const c=cfgClone();c.cats.push(name);await saveConfig(c,true)}
  const f=NEWCAT&&NEWCAT.from;NEWCAT=null;closeDialog();
  applyCatToTarget(f,final);
  toast(ex?`A categoria "${ex}" já existia e foi selecionada`:`Categoria "${name}" criada`);
}
function applyCatToTarget(from,cat){
  if(!from){render();return}
  if(from==="ed-cat"&&ED){ED.it.cat=cat;drawEditor();render();return}
  let m=from.match(/^ir-c-(\d+)$/);if(m&&S.imp&&S.imp.rows){readImpRows();S.imp.rows[+m[1]].cat=cat;render();return}
  m=from.match(/^rc-cat-(.+)$/);if(m){const c=cfgClone();const r=c.recs.find(x=>x.id===m[1]);if(r){r.cat=cat;saveConfig(c)}return}
  render();
}
async function renameCategory(oldN,newN){
  newN=(newN||"").trim().replace(/\s+/g," ");
  if(!newN||newN===oldN){render();return}
  if(newN.length>40){toast("Use até 40 caracteres");render();return}
  const clash=cfg().cats.find(c=>c!==oldN&&norm(c)===norm(newN));
  if(clash){if(!confirm(`Já existe "${clash}". Juntar "${oldN}" com ela?`)){render();return}newN=clash}
  const c=cfgClone();c.cats=c.cats.filter(x=>x!==oldN);if(!c.cats.includes(newN))c.cats.push(newN);c.recs.forEach(r=>{if(r.cat===oldN)r.cat=newN});
  await saveConfig(c,true);await moveCategory(oldN,newN);if(S.catOpen===oldN)S.catOpen=newN;if(S.filterCat===oldN)S.filterCat=newN;
  render();toast(`Categoria renomeada para "${newN}"`);
}
async function moveCategory(from,to){
  for(const ym of Object.keys(S.months)){if(!(S.months[ym].items||[]).some(it=>(it.cat||"Outros")===from))continue;
    const d=monthOrBlank(ym);d.items.forEach(it=>{if((it.cat||"Outros")===from)it.cat=to});await saveMonth(d,true)}
}
function askDeleteCategory(name){
  const n=catUsage()[name]||0;

function readEditor(){
  if(!ED)return;const g=id=>document.getElementById(id);
  if(g("ed-d"))ED.it.d=g("ed-d").value; if(g("ed-v"))ED.valStr=g("ed-v").value; if(g("ed-ym"))ED.ym2=g("ed-ym").value;
  if(g("ed-cat")&&g("ed-cat").value!=="__new__")ED.it.cat=g("ed-cat").value; if(g("ed-tag"))ED.it.tag=g("ed-tag").value.trim();
  if(g("ed-dt"))ED.it.dt=g("ed-dt").value;
  if(g("ed-n"))ED.n=Math.max(1,parseInt(g("ed-n").value)||1); if(g("ed-N"))ED.N=Math.max(2,parseInt(g("ed-N").value)||2);

function writeItems(newItems){
  const byM={};for(const x of newItems)(byM[x.ym]=byM[x.ym]||[]).push(x.item);
  for(const m in byM){const doc=monthOrBlank(m);const ids=new Set((doc.items||[]).map(i=>i.id));doc.items=(doc.items||[]).concat(byM[m].filter(i=>!ids.has(i.id)));saveMonth(doc)}
}
function expandInstallments(ym,item){
  const out=[{ym,item}];
  if(item.inst&&item.inst.N>item.inst.n){const base=stripInst(item.d);
    for(let n=item.inst.n+1;n<=item.inst.N;n++){const f=JSON.parse(JSON.stringify(item));f.id=rid();f.d=`${base} ${n}/${item.inst.N}`;f.inst={n,N:item.inst.N,g:item.inst.g};delete f.dt;out.push({ym:addM(ym,n-item.inst.n),item:f})}}
  return out;
}
let saving=false;
function saveEditor(){
  if(saving)return;readEditor();const v=parseMoney(ED.valStr);
  if(!ED.it.d.trim()){toast("Informe a descrição");return}
  if(!v||v<=0){toast("Informe um valor maior que zero");return}
  if(v>1e6){toast("Valor muito alto. Confira o número.");return}
  if(ED.instOn&&ED.n>ED.N){toast("A parcela atual não pode ser maior que o total");return}
  saving=true;setTimeout(()=>saving=false,800);
  const it=ED.it;it.v=r2(v);it.d=it.d.trim();if(!it.tag)delete it.tag;if(!it.dt)delete it.dt;if(!it.cat||it.cat==="__new__")it.cat=suggestCat(it.d);
  const target=ED.ym2||ED.ym;
  if(ED.instOn){const g=(it.inst&&it.inst.g)||rid();it.inst={n:Math.min(ED.n,ED.N),N:ED.N,g};it.d=`${stripInst(it.d)} ${it.inst.n}/${it.inst.N}`}else delete it.inst;
  if(ED.idx==null){it.id=rid();it.ts=new Date().toISOString();writeItems(expandInstallments(target,it));toast("Gasto lançado")}
  else{
    const doc=monthOrBlank(ED.ym);
    if(target===ED.ym){doc.items[ED.idx]=it;saveMonth(doc)}else{doc.items.splice(ED.idx,1);saveMonth(doc);writeItems([{ym:target,item:it}])}
    toast("Alterações salvas")}
  ED=null;drawEditor();
}
function deleteEditor(){
  const doc=monthOrBlank(ED.ym);const it=doc.items[ED.idx];
  const fut=it&&it.inst&&it.inst.g?Object.keys(S.months).filter(m=>m>ED.ym&&(S.months[m].items||[]).some(x=>x.inst&&x.inst.g===it.inst.g)):[];
  if(!confirm(fut.length?`Excluir "${it.d}" e as ${fut.length} parcela(s) seguinte(s)?`:`Excluir "${it.d}"?`))return;
  doc.items.splice(ED.idx,1);saveMonth(doc);
  for(const m of fut){const dd=monthOrBlank(m);dd.items=dd.items.filter(x=>!(x.inst&&x.inst.g===it.inst.g));saveMonth(dd)}
  toast(fut.length?"Gasto e parcelas seguintes excluídos":"Gasto excluído");
  ED=null;drawEditor();
}

async function exportXLSX(){

    const isoDate=iso=>{if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
    function table(ws,startRow,cols,rows){
      const hr=ws.getRow(startRow);cols.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c.h;cell.font={bold:true,color:{argb:"FFFFFFFF"}};cell.fill=HEAD;cell.alignment={vertical:"middle"}});hr.height=20;

      cols.forEach((c,i)=>{ws.getColumn(i+1).width=c.w||14});

    res.getCell("A2").value="Exportado em "+fmtDate(today());res.getCell("A2").font={color:{argb:"FF5F6878"}};
    table(res,4,[{h:"Fatura",w:12,fmt:"mm/yyyy"},{h:"Vencimento",w:14},{h:"Entradas",w:14,fmt:CUR},{h:"Fatura Nubank",w:15,fmt:CUR},{h:"Fatura Inter",w:14,fmt:CUR},{h:"Outras contas",w:15,fmt:CUR},{h:"Sua parte",w:14,fmt:CUR},{h:"Parte da Helena",w:16,fmt:CUR},{h:"Planejamento",w:14,fmt:CUR},{h:"Sobra",w:14,fmt:CUR},{h:"Helena pagou",w:13}],
      months.map(m=>{const t=totals(S.months[m]);const d=S.months[m];return [ymDate(m),dueName(m),r2(t.inc),r2(t.nu.tot),r2(t.inter.tot),r2(t.outros.tot),r2(t.me),r2(t.helOwes),r2(t.plan),r2(t.sobra),t.helOwes>0?(d.hel&&d.hel.paid?"Sim":"Não"):"—"]}));
    // uma aba por mês
    const itemCols=[{h:"Data",w:12,fmt:"dd/mm/yyyy"},{h:"Descrição",w:34},{h:"Onde",w:14},{h:"Categoria",w:30},{h:"Quem paga",w:13},{h:"Parcela",w:9},{h:"Valor total",w:14,fmt:CUR},{h:"Sua parte",w:14,fmt:CUR},{h:"Helena",w:14,fmt:CUR},{h:"Etiqueta",w:14}];
    const itemRowX=it=>[isoDate(it.dt),it.d,CARDS[it.c]?CARDS[it.c].name:it.c,it.cat||"Outros",SPLIT[it.sp],it.inst?`${it.inst.n}/${it.inst.N}`:"",r2(it.v),r2(myShare(it)),r2(helShare(it)),it.tag||""];
    for(const m of months){
      const d=S.months[m];const t=totals(d);const [y,mm]=m.split("-");
      const ws=wb.addWorksheet(`${MES3[+mm-1][0].toUpperCase()+MES3[+mm-1].slice(1)}-${y}`);
      ws.getCell("A1").value=`Fatura de ${mLabel(m)} · vence em ${dueName(m)}`;ws.getCell("A1").font={bold:true,size:14};
      const kv=[["Entradas",t.inc],["Fatura Nubank",t.nu.tot],["Fatura Inter",t.inter.tot],["Outras contas",t.outros.tot],["Sua parte",t.me],["Planejamento",t.plan],["Sobra",t.sobra],["Helena deve",t.helOwes]];
      kv.forEach(([k,v],i)=>{const r=ws.getRow(3+Math.floor(i/2));const c0=(i%2)*3+1;r.getCell(c0).value=k;r.getCell(c0).font={bold:true};r.getCell(c0+1).value=r2(v);r.getCell(c0+1).numFmt=CUR});
      table(ws,9,itemCols,(d.items||[]).map(itemRowX));

    table(catWs,1,[{h:"Categoria",w:32}].concat(pm.map(m=>({h:mShort(m),w:12,fmt:CUR}))).concat([{h:"Total",w:14,fmt:CUR}]),
      cats.map(c=>{const vals=pm.map(m=>r2(catTotals(S.months[m])[c]||0));return [c].concat(vals).concat([r2(vals.reduce((a,b)=>a+b,0))])}).filter(r=>r[r.length-1]!==0||true));
    // Lançamentos (todos)

      months.flatMap(m=>(S.months[m].items||[]).map(it=>[ymDate(m)].concat(itemRowX(it)).concat([it.rec?"Sim":""]))));

      cfg().recs.map(r=>[r.d,r2(r.v),CARDS[r.c]?CARDS[r.c].name:r.c,r.cat,SPLIT[r.sp],r.on?"Sim":"Não",r.from?mShort(r.from):""]));
    const buf=await wb.xlsx.writeBuffer();

    toast("Planilha Excel pronta");
  }catch(e){console.error(e);toast("Erro ao gerar a planilha. Tente de novo.")}
}

    case "eye":S.hideVals=!S.hideVals;document.body.classList.toggle("hide-vals",S.hideVals);try{localStorage.setItem("gm.hide",S.hideVals?"1":"0")}catch(_){}render();break;

      const c=cfg();d.inc=(p?p.inc:c.incDefault).map(x=>({id:rid(),d:x.d,v:x.v}));d.plan=(p?p.plan:c.planDefault).map(x=>({id:rid(),d:x.d,v:x.v}));d.initDone=true;saveMonth(d);toast("Entradas e planejamento copiados");break}

        const inp=document.getElementById("rv-"+id);const v=inp?parseMoney(inp.value):r.v;
        d.items.push({id:rid(),d:r.d,v:r2(v||r.v),c:r.c,cat:r.cat,sp:r.sp,rec:r.id,ts:new Date().toISOString()});d.rec[id]="ok"}
      saveMonth(d);toast(a==="recSkip"?"Pulado neste mês":"Lançado");break}
    case "togglePaid":{const d=doc();d.hel=d.hel||{};d.hel.paid=!d.hel.paid;d.hel.paidAt=d.hel.paid?today():null;saveMonth(d);break}
    case "copyHel":{const ta=document.getElementById("heltext");const txt=ta?ta.value:helenaSummaryText(S.ym,helDoc(S.ym));
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Resumo copiado")).catch(()=>{S.open["h-text"]=true;render();const t=document.getElementById("heltext");if(t){t.focus();t.select()}toast("Selecionei o texto. Copie com Ctrl+C ou segurando o dedo.")});break}
    case "impCard":S.imp.card=el.dataset.c;S.imp.text=document.getElementById("imptext").value;render();break;
    case "impRead":{const I=S.imp;I.text=document.getElementById("imptext").value;I.ym=document.getElementById("impym").value;I.skipNeg=document.getElementById("impneg").checked;
      const rows=parseImport(I.text,I.skipNeg);if(!rows.length){toast("Não encontrei compras nesse texto");break}
      I.rows=rows;I.pdf=null;markDups(I);render();break}
    case "impClear":S.imp=null;render();break;
    case "impSave":{const I=S.imp;readImpRows();const ymEl=document.getElementById("impym");if(ymEl)I.ym=ymEl.value;const sel=I.rows.filter(r=>r.on);if(!sel.length){toast("Nenhuma linha selecionada");break}
      const n=applyImport(I,sel);toast(n+" lançamentos adicionados");S.ym=I.ym;S.userNav=true;S.imp=null;S.tab="lanc";setTab();break}
    case "pwOk":{const v=document.getElementById("pw-in").value;const f=PW;PW=null;closeDialog();if(f)f(v);break}
    case "pwCancel":{const f=PW;PW=null;closeDialog();if(f)f(null);break}
    case "recAdd":{const c=cfgClone();c.recs.push({id:"r"+rid(),d:"Novo gasto fixo",v:0,c:"nu",cat:"Lazer / Assinaturas",sp:"me",on:true,from:S.ym});S.open["a-fixos"]=true;saveConfig(c);break}
    case "recDel":{if(!confirm("Excluir este gasto fixo? Os lançamentos já feitos continuam."))break;const c=cfgClone();c.recs=c.recs.filter(r=>r.id!==el.dataset.id);saveConfig(c);break}
    case "login":doLogin();break;
    case "switchAcc":S.error=null;signOut(AUTH).then(()=>{S.needLogin=true;render()});break;
    case "logout":if(confirm("Sair desta conta neste aparelho?"))signOut(AUTH);break;
    case "helLink":{if(!S.token){toast("Link indisponível");break}const url=location.origin+location.pathname+"#h="+S.token;
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link da Helena copiado")).catch(()=>prompt("Copie o link:",url));break}
  }
});
function readImpRows(){const I=S.imp;if(!I||!I.rows)return;I.rows.forEach((r,i)=>{const g=f=>document.getElementById(f);if(g("ir-on-"+i))r.on=g("ir-on-"+i).checked;if(g("ir-d-"+i))r.d=g("ir-d-"+i).value;if(g("ir-c-"+i)&&g("ir-c-"+i).value!=="__new__")r.cat=g("ir-c-"+i).value;if(g("ir-s-"+i))r.sp=g("ir-s-"+i).value})}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches&&t.matches("select[data-catsel]")&&t.value==="__new__"){
    if(t.id==="ed-cat")readEditor();
    openNewCat(t.id);return}
  if(t.id==="ed-inst"){readEditor();ED.instOn=t.checked;const i=instOf(ED.it.d);if(i){ED.n=i.n;ED.N=i.N}drawEditor();return}
  if(t.id==="ed-d"){setTimeout(()=>{if(!ED)return;const L=learn().get(baseKey(t.value));readEditor();if(L&&ED.idx==null){ED.it.cat=CAT_RENAME[L.cat]||L.cat;ED.it.sp=L.sp;ED.it.c=L.c}else if(ED.idx==null){ED.it.cat=suggestCat(t.value)}const i=instOf(t.value);if(i&&ED.idx==null){ED.instOn=true;ED.n=i.n;ED.N=i.N}drawEditor()},0);return}
  if(t.id==="ed-n"||t.id==="ed-N"){readEditor();drawEditor();return}
  if(t.id==="fcat"){S.filterCat=t.value;render();return}
  if(t.dataset.catren!=null){renameCategory(t.dataset.catren,t.value);return}
  if(t.dataset.edit){const d=monthOrBlank(S.ym);const k=t.dataset.edit;const row=(d[k]||[]).find(x=>x.id===t.dataset.id);if(!row)return;
    if(t.dataset.f==="v"){const v=parseMoney(t.value);if(v==null){toast("Valor inválido");render();return}row.v=r2(v)}else row.d=t.value;saveMonth(d);return}
  if(t.dataset.rec){const c=cfgClone();const r=c.recs.find(x=>x.id===t.dataset.rec);if(!r)return;const f=t.dataset.f;
    if(f==="v"){const v=parseMoney(t.value);if(v==null||v<0){toast("Valor inválido");render();return}r.v=r2(v)}else r[f]=f==="on"?t.checked:t.value;saveConfig(c);return}
  if(t.dataset.imp!=null){readImpRows();return}
  if(t.id==="bkfile"){const f=t.files&&t.files[0];if(f)importBackup(f);t.value="";return}
  if(t.id==="pix"){const c=cfgClone();c.pix=t.value.trim();saveConfig(c);return}
  if(t.id==="pdfnu"||t.id==="pdfinter"){const f=t.files&&t.files[0];t.value="";if(f)importPdfFile(f,t.id==="pdfnu"?"nu":"inter");return}
  if(t.id==="impym"&&S.imp){if(S.imp.rows){readImpRows();S.imp.ym=t.value;markDups(S.imp);render()}else S.imp.ym=t.value;return}
  if(t.id==="impfile"){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.imp.text=String(rd.result);S.imp.ym=document.getElementById("impym").value;render()};rd.readAsText(f,"utf-8");return}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.drw")){S.open[d.dataset.key]=d.open;try{localStorage.setItem("gm.open",JSON.stringify(S.open))}catch(_){}}},true);
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.query=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
  if(e.target.id==="ed-v"&&ED){ED.valStr=e.target.value;const v=parseMoney(ED.valStr)||0;const me=ED.it.sp==="me"?v:ED.it.sp==="half"?v/2:0;const p=document.querySelector(".preview");if(p){p.children[0].textContent=fmt(me);p.children[1].textContent=fmt(v-me)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("dlg").innerHTML){closeDialog();if(NEWCAT){NEWCAT=null;ED?drawEditor():render()}}else if(ED){ED=null;drawEditor()}}
  if(e.key==="Enter"&&e.target.id==="nc-name"){e.preventDefault();createCategory()}
  if(e.key==="Enter"&&e.target.id==="pw-in"){e.preventDefault();const f=PW;const v=e.target.value;PW=null;closeDialog();if(f)f(v)}});
document.getElementById("bnav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;setTab()});
function setTab(){try{if(S.tab!=="helena")localStorage.setItem("gm.tab",S.tab)}catch(_){}render();window.scrollTo(0,0)}
/* tooltips */
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.hidden=true;return}
  const parts=t.getAttribute("data-tip").split("|");tip.innerHTML=`<div>${esc(parts[0])}</div>`+parts.slice(1).map(p=>`<b>${esc(p)}</b>`).join("<br>");tip.hidden=false;
  const x=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-12);tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("pointerleave",()=>tip.hidden=true);
document.addEventListener("click",e=>{const g=e.target.closest&&e.target.closest("[data-goto]");if(g){S.userNav=true;S.ym=g.getAttribute("data-goto");S.tab="inicio";setTab()}});
let toastT=null;function toast(m){document.body.classList.toggle("modal-open",!!(document.getElementById("modal").innerHTML||document.getElementById("dlg").innerHTML));const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
window.addEventListener("beforeunload",e=>{if(S.pending>0&&navigator.onLine){e.preventDefault();e.returnValue=""}});
render();boot();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
